name: Daily NSE movers

on:
  schedule:
    # 05:00 UTC, Monday–Friday = 10:30 AM IST
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-movers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run daily NSE movers job
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REASON_PROVIDER: scraper
          ALLOW_WEEKEND_RUN: "true"
          LOG_LEVEL: INFO
        run: |
          python -m backend.run_daily_job

      - name: Commit updated alert history
        run: |
          if [ ! -f data/alerts_history.csv ]; then
            echo "No history file generated. Skipping commit."
            exit 0
          fi

          if git diff --quiet -- data/alerts_history.csv; then
            echo "No changes in alert history. Skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/alerts_history.csv
          git commit -m "chore(data): update alerts history [skip ci]"
          git push
